name: Scheduled cleanup authentication probe

on:
  workflow_dispatch:
    inputs:
      probe_client_id:
        description: Client ID of the isolated cleanup test application
        required: true
        type: string

permissions: {}

jobs:
  authenticate:
    if: github.ref == 'refs/heads/qfai/rerun-auth-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify scheduled cleanup authentication without deleting resources
        env:
          CLEAN_CLIENT_ID: ${{ inputs.probe_client_id }}
          CLEAN_TENANT_ID: ${{ vars.TEST_TENANT_CLEAN_TENANT_ID }}
          M365_ACCOUNT_PASSWORD: ${{ secrets.TEST_TENANT_M365_ACCOUNT_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          const {
            CLEAN_CLIENT_ID: clientId,
            CLEAN_TENANT_ID: tenantId,
            M365_ACCOUNT_PASSWORD: password,
          } = process.env;
          const username = "test001@atktesting08.onmicrosoft.com";
          const uuid = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
          if (!uuid.test(clientId ?? "") || tenantId !== "16801f2e-7163-4bd5-8542-f083fa59993c" || !password) {
            throw new Error("Missing probe inputs or unexpected tenant.");
          }
          const token = await fetch(`https://login.microsoftonline.com/${tenantId}/oauth2/v2.0/token`, {
            method: "POST",
            redirect: "error",
            body: new URLSearchParams({
              client_id: clientId,
              grant_type: "password",
              scope: "https://graph.microsoft.com/.default",
              username,
              // Match the password encoding in GraphApiCleanHelper.
              password: encodeURIComponent(password),
            }),
            signal: AbortSignal.timeout(30000),
          });
          const result = await token.json();
          if (!token.ok || typeof result.access_token !== "string") {
            const codes = Array.isArray(result.error_codes)
              ? result.error_codes.filter(Number.isInteger).map((code) => `AADSTS${code}`).join(", ")
              : "";
            const correlation = uuid.test(result.correlation_id ?? "") ? result.correlation_id : "unavailable";
            throw new Error(`Entra token request failed (HTTP ${token.status}, ${codes || "no error code"}; correlation ID ${correlation}).`);
          }
          const graph = await fetch("https://graph.microsoft.com/v1.0/me?$select=id", {
            headers: { Authorization: `Bearer ${result.access_token}` },
            redirect: "error",
            signal: AbortSignal.timeout(30000),
          });
          if (!graph.ok || !uuid.test((await graph.json()).id ?? "")) {
            throw new Error(`Read-only Graph /me probe failed (HTTP ${graph.status}).`);
          }
          console.log("Delegated Graph token acquired; read-only /me request succeeded.");
          JS
