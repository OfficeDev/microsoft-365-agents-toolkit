name: Scheduled cleanup matrix authentication probe

on:
  workflow_dispatch:
    inputs:
      verify_scheduled_auth:
        description: Verify scheduled account authentication without running cleanup
        required: true
        type: boolean

permissions: {}

jobs:
  verify-matrix-auth:
    if: github.ref == 'refs/heads/qfai/rerun-auth-probe' && inputs.verify_scheduled_auth
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the configured replacement identity for each scheduled account
        env:
          CLEAN_CLIENT_ID: ${{ vars.TEST_TENANT_CLEAN_CLIENT_ID }}
          CLEAN_TENANT_ID: ${{ vars.TEST_TENANT_CLEAN_TENANT_ID }}
          M365_USERNAMES: ${{ vars.M365_USERNAMES }}
          M365_ACCOUNT_PASSWORD: ${{ secrets.TEST_TENANT_M365_ACCOUNT_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          const {
            CLEAN_CLIENT_ID: clientId,
            CLEAN_TENANT_ID: tenantId,
            M365_USERNAMES: users,
            M365_ACCOUNT_PASSWORD: password,
          } = process.env;
          const names = (users ?? "").split(",").map((name) => name.trim().toLowerCase()).filter(Boolean);
          if (clientId !== "d76c7524-1d8d-4b6b-8579-8ae566a2e6ff" ||
              tenantId !== "16801f2e-7163-4bd5-8542-f083fa59993c" ||
              !password || !names.length || names.length > 50 || new Set(names).size !== names.length ||
              names.some((name) => !/^test\d{3}@atktesting08\.onmicrosoft\.com$/.test(name))) {
            throw new Error("Missing or unexpected scheduled configuration.");
          }
          const graphUrl = "https://graph.microsoft.com";
          const options = () => ({ redirect: "error", signal: AbortSignal.timeout(30000) });
          async function getToken(appId, scope, username) {
            const response = await fetch(`https://login.microsoftonline.com/${tenantId}/oauth2/v2.0/token`, {
              ...options(),
              method: "POST",
              body: new URLSearchParams({
                client_id: appId, scope, grant_type: "password", username,
                // Match the scheduled MSAL call's password encoding.
                password: encodeURIComponent(password),
              }),
            });
            const body = await response.json();
            if (!response.ok || typeof body.access_token !== "string") {
              const codes = Array.isArray(body.error_codes)
                ? body.error_codes.filter(Number.isInteger).map((code) => `AADSTS${code}`).join(",")
                : "";
              throw new Error(`token HTTP ${response.status}${codes ? ` ${codes}` : ""}`);
            }
            return body.access_token;
          }
          async function verifyGraph(username) {
            const token = await getToken(clientId, `${graphUrl}/.default`, username);
            const headers = { Authorization: `Bearer ${token}` };
            const me = await fetch(`${graphUrl}/v1.0/me?$select=userPrincipalName`, { ...options(), headers });
            if (!me.ok) throw new Error(`/me HTTP ${me.status}`);
            if ((await me.json()).userPrincipalName?.toLowerCase() !== username) {
              throw new Error("/me authenticated an unexpected account");
            }
            const apps = await fetch(`${graphUrl}/v1.0/applications?$top=1&$select=id`, { ...options(), headers });
            if (!apps.ok) throw new Error(`/applications HTTP ${apps.status}`);
          }
          const checks = [
            ["Graph", verifyGraph],
            ["SharePoint token", (username) => getToken(clientId, "https://atktesting08.sharepoint.com/AllSites.FullControl", username)],
            ["M365 Titles token", (username) => getToken("7ea7c24c-b1f6-4a20-9d11-9ae12e9e7ac0", "https://titles.prod.mos.microsoft.com/.default", username)],
          ];
          const passes = new Map(checks.map(([label]) => [label, 0]));
          let index = 0;
          async function worker() {
            while (index < names.length) {
              const slot = index++;
              for (const [label, check] of checks) {
                try {
                  await check(names[slot]);
                  passes.set(label, passes.get(label) + 1);
                } catch (error) {
                  console.log(`Matrix slot ${slot + 1} ${label} failed: ${error.message}`);
                }
              }
            }
          }
          await Promise.all(Array.from({ length: Math.min(3, names.length) }, worker));
          for (const [label, count] of passes) console.log(`${label}: ${count}/${names.length} passed`);
          if ([...passes.values()].some((count) => count < names.length)) {
            throw new Error("At least one scheduled account check failed.");
          }
          JS
