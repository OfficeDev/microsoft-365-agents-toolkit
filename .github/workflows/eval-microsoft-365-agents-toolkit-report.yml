name: Report Microsoft 365 Agents Toolkit Skill Evaluation

on:
  workflow_run:
    workflows: ["Evaluate Microsoft 365 Agents Toolkit Skill"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha || github.event.repository.default_branch }}

      - name: Download raw evaluation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-eval-raw
          path: ${{ runner.temp }}/skill-eval-raw
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate raw evaluation results
        id: validate-results
        env:
          RAW_RESULTS_DIR: ${{ runner.temp }}/skill-eval-raw
        run: |
          set -euo pipefail

          mapfile -d '' artifact_entries < <(find "$RAW_RESULTS_DIR" -mindepth 1 -print0)
          expected_file="$RAW_RESULTS_DIR/latest.json"
          if [ "${#artifact_entries[@]}" -ne 1 ] || [ "${artifact_entries[0]}" != "$expected_file" ]; then
            printf 'Unexpected artifact entry: %q\n' "${artifact_entries[@]}"
            exit 1
          fi

          if [ ! -f "$expected_file" ] || [ -L "$expected_file" ]; then
            echo "latest.json must be a regular, non-symbolic-link file."
            exit 1
          fi

          node -e \
            'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));' \
            "$expected_file"
          install -m 0644 "$expected_file" evals/results/latest.json

      - name: Compare with baseline
        continue-on-error: true
        run: node evals/results/generate-compare-json.js

      - name: Generate comparison Markdown
        if: always()
        run: node evals/results/generate-compare-markdown.js

      - name: Generate comparison dashboard
        if: always()
        run: node evals/results/generate-compare-dashboard.js

      - name: Generate PR comment token
        id: generate-comment-token
        if: >-
          always() &&
          steps.validate-results.outcome == 'success' &&
          (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_target')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post comparison comment on PR
        if: >-
          always() &&
          steps.generate-comment-token.outcome == 'success' &&
          (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_target')
        env:
          GITHUB_TOKEN: ${{ steps.generate-comment-token.outputs.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node evals/results/post-pr-comment.js

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-eval-results
          path: |
            ./evals/results/latest.json
            ./evals/results/compare.json
            ./evals/results/compare.md
            ./evals/results/compare-dashboard.html
          retention-days: 30

      - name: Prepare baseline update
        id: prepare-baseline
        if: >-
          always() &&
          steps.validate-results.outcome == 'success' &&
          (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_target') &&
          github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
        run: |
          if [ ! -f evals/results/latest.json ]; then
            echo "No latest evaluation result to commit."
            exit 0
          fi

          git check-ref-format "refs/heads/$HEAD_BRANCH"
          remote_head=$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)
          if [ "$remote_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The PR branch changed after this evaluation; skipping the stale baseline update."
            exit 0
          fi

          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          cp evals/results/latest.json evals/results/baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/results/baseline.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update baseline from latest eval results (PR sync)"
          echo "should-push=true" >> "$GITHUB_OUTPUT"

      - name: Generate baseline update token
        id: generate-baseline-token
        if: >-
          always() &&
          steps.prepare-baseline.outcome == 'success' &&
          steps.prepare-baseline.outputs.should-push == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push baseline update
        if: >-
          always() &&
          steps.generate-baseline-token.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.generate-baseline-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
        run: |
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$HEAD_BRANCH"
