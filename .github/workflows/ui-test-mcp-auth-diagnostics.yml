name: Diagnose MCP authentication prerequisites

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact ATK image used by the failing UI run."
        type: string
        required: true
        default: "feat-16840-dcr-update_20261027050448"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: engineering
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
      M365_ACCOUNT_NAME: ${{ vars.M365_ACCOUNT_NAME_ENABLECOPILOTACCESS }}
      M365_ACCOUNT_PASSWORD: ${{ secrets.M365_ACCOUNT_PASSWORD_ENABLECOPILOTACCESS }}
      DA_MCP_OAUTH_CLIENTID: ${{ vars.DA_MCP_OAUTH_CLIENTID }}
      DA_MCP_OAUTH_CLIENT_SECRET: ${{ secrets.DA_MCP_OAUTH_CLIENT_SECRET }}
      DA_MCP_ENTRA_SSO_CLIENTID: ${{ vars.DA_MCP_ENTRA_SSO_CLIENTID }}
      MCP_AUTH_SSO_ID: ${{ secrets.ENTRA_SSO_REGISTRATION_ID }}
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run read-only authentication diagnostics
        run: |
          set -o pipefail
          IMAGE="ghcr.io/officedev/vscuse-atk-vscode:$IMAGE_TAG"
          docker pull "$IMAGE"
          docker run --rm --entrypoint node \
            -v "$GITHUB_WORKSPACE/packages/tests/vscuse/vscode-test-cases/engine/mcp-auth-diagnostics.cjs:/tmp/mcp-auth-diagnostics.cjs:ro" \
            -e M365_TENANT_ID -e M365_ACCOUNT_NAME -e M365_ACCOUNT_PASSWORD \
            -e DA_MCP_OAUTH_CLIENTID -e DA_MCP_OAUTH_CLIENT_SECRET \
            -e DA_MCP_ENTRA_SSO_CLIENTID -e MCP_AUTH_SSO_ID \
            "$IMAGE" /tmp/mcp-auth-diagnostics.cjs
