name: SDK Dependency Auto Upgrade
on:
  schedule:
    # The "*" (#42, asterisk) character has special semantics in YAML, so this
    # string has to be quoted.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get TeamsFx Renovate App Token
        id: teamsfx-renovate
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.RENOVATE_APP_ID }}
          private_key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: "${{ steps.teamsfx-renovate.outputs.token }}"
          configurationFile: .github/renovate.json
        env:
          RENOVATE_FORK_TOKEN: "${{ secrets.FORK_RENOVATE_PAT }}"
