name: Validate Microsoft 365 Agents Toolkit Skill Evaluations

on:
  pull_request:
    paths:
      - "packages/vscode-extension/skills/microsoft-365-agents-toolkit/**"
      - "evals/microsoft-365-agents-toolkit/**"
      - ".github/workflows/eval-microsoft-365-agents-toolkit.yml"
      - ".github/workflows/validate-microsoft-365-agents-toolkit-evals.yml"

permissions:
  contents: read

jobs:
  validate-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evaluation definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
          path: eval-source
          sparse-checkout: evals/microsoft-365-agents-toolkit

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install schema validator
        working-directory: ${{ runner.temp }}
        run: python -m pip install check-jsonschema==0.38.0

      - name: Validate evaluation schemas
        working-directory: ${{ runner.temp }}
        run: |
          eval_root="$GITHUB_WORKSPACE/eval-source/evals/microsoft-365-agents-toolkit"
          if find "$eval_root" -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in evaluation definitions."
            exit 1
          fi

          python -m check_jsonschema \
            --schemafile https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json \
            "$eval_root/eval.yaml"

          mapfile -d '' task_files < <(find \
            "$eval_root" \
            -type f \
            -path '*-tasks/*' \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -print0)
          if [ "${#task_files[@]}" -eq 0 ]; then
            echo "No evaluation task files found."
            exit 1
          fi
          python -m check_jsonschema \
            --schemafile https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json \
            "${task_files[@]}"
