version: 1

cases:
  - id: feature-validate-plugin-manifest
    scenarioId: VCB-204
    workItemIds: [28041252]
    gate: manual
    steps:
      [
        scaffold,
        check-scaffold,
        login-m365,
        provision,
        invalidate-plugin,
        validate,
      ]

  - id: feature-da-manifest-file-function-manifest-plugin-support
    scenarioId: VCB-204
    workItemIds: [29307173]
    gate: manual
    steps:
      [
        scaffold,
        check-scaffold,
        login-m365,
        reference-instruction,
        provision,
        check-resolved,
      ]

steps:
  scaffold:
    type: scaffold
    with:
      template: da/api-plugin-from-existing-api
      answers:
        - question: projectType
          value: copilot-agent-type
        - question: daTemplate
          value: add-action
        - question: actionSource
          value: openapi
        - question: openApiSpecType
          value: enter-url
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/Alive-Fish/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-scaffold:
    type: checks
    with:
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"file": "declarativeAgent.json"']
      - type: file
        path: appPackage/declarativeAgent.json
        expect:
          contains: ['"file": "ai-plugin.json"']
      - type: file
        path: appPackage/ai-plugin.json
        expect:
          contains:
            ['"name_for_human"', '"description_for_human"', '"type": "None"']
      - type: file
        path: appPackage/instruction.txt
        expect:
          contains: [You are a declarative agent]

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  provision:
    type: provision

  invalidate-plugin:
    type: configurePluginManifest
    with:
      mode: invalid-property

  validate:
    type: validateManifest

  reference-instruction:
    type: configurePluginManifest
    with:
      mode: file-reference

  check-resolved:
    type: checks
    with:
      - type: file
        path: appPackage/build/manifest.dev.json
        expect:
          contains: [You are a declarative agent]
          notContains: ["$[file("]
      - type: file
        path: appPackage/build/ai-plugin.dev.json
        expect:
          contains: [You are a declarative agent]
          notContains: ["$[file("]
