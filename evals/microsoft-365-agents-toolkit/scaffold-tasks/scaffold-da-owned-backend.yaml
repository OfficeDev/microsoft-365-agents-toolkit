# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json

id: scaffold-da-owned-backend
name: Scaffold Declarative Agent with Project-Owned Backend Using ATK
description: User wants a Declarative Agent with new backend source code
tags:
  - scaffold
  - routing
  - project-owned-backend
inputs:
  prompt: "Create a TypeScript Declarative Agent named OwnedBackendDaFixture with a new API action and scaffold the API backend source code for me. Then validate and package the project."
expected:
  should_trigger: true
graders:
  - type: file
    name: owned_backend_da_project_files
    config:
      must_exist:
        - "OwnedBackendDaFixture/m365agents.yml"
        - "OwnedBackendDaFixture/appPackage/manifest.json"
        - "OwnedBackendDaFixture/src/functions/repairs.ts"
        - "OwnedBackendDaFixture/infra/azure.bicep"
  - type: behavior
    name: efficiency_check
    config:
      max_tool_calls: 40
      max_duration_ms: 240000
      forbidden_tools:
        - rm
        - sudo
  - type: tool_constraint
    name: atk_owned_backend_create_command
    config:
      expect_tools:
        - tool: shell
          command_pattern: '(?i)\batk\s+new\b[^\r\n]*\s-c\s+declarative-agent-action\b'
        - tool: shell
          command_pattern: '(?i)\batk\s+validate\b'
        - tool: shell
          command_pattern: '(?i)\batk\s+package\b'
      reject_tools:
        - tool: shell
          command_pattern: '(?i)\bwiqd\s+agent\b'
  - type: prompt
    name: quality_check
    config:
      prompt: |
        Review the agent's response. Check that it:
        1. Uses `atk new -c declarative-agent-action -l typescript` because the request requires new backend source code.
        2. Successfully scaffolds the DA manifest, API backend source, infrastructure, and ATK lifecycle configuration.
        3. Selects ATK because the project has project-owned backend source and backend deployment lifecycle actions.
        4. Uses ATK to validate and package the project and does not switch it to WIQD.

        If all criteria are met, call set_waza_grade_pass.
        Otherwise, call set_waza_grade_fail with your reasoning.
      model: "gpt-5.4"
      continue_session: true
