# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json

id: scaffold-da-template
name: Create Declarative Agent with WIQD
description: User wants to create a Declarative Agent with WIQD
tags:
  - scaffold
  - routing
inputs:
  prompt: "Create a Declarative Agent named WazaDaFixture for HR FAQs under the current directory, keeping the generated WazaDaFixture project folder."
expected:
  should_trigger: true
graders:
  - type: file
    name: da_project_files
    config:
      must_exist:
        - "WazaDaFixture/appPackage/manifest.json"
        - "WazaDaFixture/appPackage/declarativeAgent.json"
  - type: behavior
    name: efficiency_check
    config:
      max_tool_calls: 40
      max_duration_ms: 240000
      forbidden_tools:
        - rm
        - sudo
  - type: skill_invocation
    name: wiqd_plugin_delegation
    config:
      mode: exact_match
      required_skills:
        - wiqd
      allow_extra: false
  - type: tool_constraint
    name: no_atk_da_commands
    config:
      reject_tools:
        - tool: shell
          command_pattern: '(?i)\batk\s+(new|provision|deploy|validate|package|publish|uninstall)\b'
  - type: prompt
    name: quality_check
    config:
      prompt: |
        Review the agent's response. Check that the response is:
        1. Delegates creation of the Declarative Agent to the `wiqd` plugin.
        2. Lets the WIQD plugin own its workflow, prerequisites, and implementation details instead of prescribing WIQD CLI commands.
        3. Does not run `atk new` or another ATK lifecycle command for the Declarative Agent.

        If all criteria are met, call set_waza_grade_pass.
        Otherwise, call set_waza_grade_fail with your reasoning.
      model: "gpt-5.4"
      continue_session: true
